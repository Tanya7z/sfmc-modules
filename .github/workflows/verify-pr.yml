name: Verify registry PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-registry-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: node --test
      - run: npm run build
