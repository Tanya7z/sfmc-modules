name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      - name: Validate index.json map v2
        run: |
          node -e '
            const j = require("./index.json");
            if (typeof j.version !== "number" || j.version < 2) throw new Error("version must be >= 2");
            if (!j.modules || Array.isArray(j.modules) || typeof j.modules !== "object") {
              throw new Error("modules must be an object map");
            }
            for (const [id, e] of Object.entries(j.modules)) {
              if (id.startsWith("_")) continue;
              const hasNpm = typeof e.npm === "string" && e.npm.length > 0;
              const hasGh = typeof e.repo === "string" && typeof e.tag === "string";
              if (!hasNpm && !hasGh) throw new Error(id + ": need npm or repo+tag");
            }
            console.log("ok", Object.keys(j.modules).length, "modules");
          '
